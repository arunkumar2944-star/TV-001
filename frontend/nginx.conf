server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Media uploads: video and audio need a generous body size.
    client_max_body_size 250m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # This is an internal tool - keep it out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Everything under /api goes to the Express service, so the browser only
    # ever sees one origin and the session cookie stays SameSite=Lax.
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        # Large uploads and slow platform callbacks.
        proxy_read_timeout    900s;
        proxy_send_timeout    900s;
        proxy_request_buffering off;
    }

    # Single page app: unknown paths are client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
